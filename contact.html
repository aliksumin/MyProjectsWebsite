<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — Albert Sumin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet" />
<style>
:root{
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --paper:oklch(0.962 0.004 95);
  --paper2:oklch(0.93 0.006 95);
  --ink:oklch(0.18 0.01 95);
  --mut:oklch(0.45 0.01 95);
  --line:oklch(0.18 0.01 95 / .16);
  --switch-bg:#15140f;--switch-fg:#f7f5ee;--switch-mut:rgba(247,245,238,.55);--switch-bd:rgba(247,245,238,.18);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--mono);background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;}
a{color:inherit;text-decoration:none;}
.wrap{max-width:1400px;margin:0 auto;padding:0 clamp(20px,4vw,64px);width:100%;}
.mono-label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);}

header{position:fixed;top:0;left:0;right:0;z-index:500;
  border-bottom:1px solid var(--line);background:color-mix(in oklch,var(--paper) 86%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.hd{display:flex;justify-content:space-between;align-items:center;height:58px;}
.hd__name{font-weight:800;letter-spacing:.04em;font-size:14px;}
.hd__nav{display:flex;gap:26px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;}
.hd__nav a{color:var(--mut);transition:color .25s;}
.hd__nav a:hover,.hd__nav a.is-active{color:var(--ink);}
@media(max-width:680px){.hd__nav a:not(.is-back){display:none;}}

main{flex:1;display:flex;flex-direction:column;justify-content:center;padding-top:108px;padding-bottom:60px;}
.lab{font-size:13px;letter-spacing:.2em;color:var(--mut);text-transform:uppercase;margin-bottom:22px;}
.mail-wrap{border-top:1px solid var(--ink);border-bottom:1px solid var(--line);padding:30px 0;}
/* The address must sit on ONE line at every width. In JetBrains Mono at this
   tracking each character is 0.58em, so a 24-character address needs 13.92em.
   The old 7vw ramp outgrew its container at every size (the container widens
   at ~0.92vw), so the address always wrapped — and word-break:break-all split
   it mid-word, e.g. "gmail.c / om". 6.2vw keeps 24 chars inside from 320px up;
   88px caps it where the 1400px wrap stops growing.
   If the address ever gets much longer, lower 6.2vw by roughly 24/newLength. */
.mail{font-weight:800;letter-spacing:-.02em;text-transform:lowercase;
  font-size:clamp(16px,6.2vw,88px);line-height:.98;display:inline-block;
  transition:transform .4s cubic-bezier(.16,1,.3,1);white-space:nowrap;}
.mail:hover{transform:skewX(-7deg);}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;margin-top:48px;}
@media(max-width:860px){.grid{grid-template-columns:repeat(2,1fr);gap:30px 24px;}}
@media(max-width:480px){.grid{grid-template-columns:1fr;}}
.cell h3{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:10px;}
.cell p,.cell a{font-size:15px;line-height:1.5;display:block;}
.cell a{transition:color .2s;color:var(--ink);}
.cell a:hover{color:var(--mut);}
.cell .sub{font-size:11px;color:var(--mut);letter-spacing:.04em;margin-top:2px;}

.socials{display:flex;flex-wrap:wrap;gap:10px;margin-top:48px;}
.socials a{font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--ink);
  border-radius:100px;padding:13px 20px;display:inline-flex;gap:10px;align-items:center;
  transition:background .25s,color .25s;}
.socials a em{font-style:normal;color:var(--mut);}
.socials a:hover{background:var(--ink);color:var(--paper);}
.socials a:hover em{color:var(--paper2);}

footer{border-top:1px solid var(--line);}
.foot__row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;padding:30px 0;
  font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;}

.reveal{opacity:0;transform:translateY(20px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1);}
.reveal.in{opacity:1;transform:none;}
.reveal.d1{transition-delay:.08s;}.reveal.d2{transition-delay:.16s;}.reveal.d3{transition-delay:.24s;}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none;}}
</style>
<link rel="stylesheet" href="assets/css/mobile.css" />
</head>
<body>
<header>
  <div class="wrap hd">
    <a href="about.html" class="hd__name" data-name>Albert Sumin</a>
    <nav class="hd__nav">
      <a href="about.html">About</a>
      <a class="is-back" href="index.html">Projects</a>
      <a href="collaborations.html">Team Works</a>
      <a class="is-active" href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="lab reveal">Contact</div>
  <div class="mail-wrap reveal d1">
    <a class="mail" id="mail" href="#">email</a>
  </div>

  <div class="grid">
    <div class="cell reveal d1"><h3>Name</h3><p id="c-name"></p><p class="sub" id="c-born"></p></div>
    <div class="cell reveal d1"><h3>Role</h3><p id="c-role"></p></div>
    <div class="cell reveal d2"><h3>Based in</h3><p id="c-loc"></p></div>
    <div class="cell reveal d2"><h3>Phone</h3><a id="c-phone" href="#"></a></div>
  </div>

  <div class="socials reveal d3" id="socials"></div>
</main>

<footer>
  <div class="wrap foot__row">
    <span data-name>Albert Sumin</span>
    <a href="index.html#work">Projects ↗</a>
    <span>© 2026</span>
  </div>
</footer>

<script src="assets/js/about-data.js"></script>
<script src="assets/js/switcher.js"></script>
<script>
const C=window.CONTACT;
document.querySelectorAll('[data-name]').forEach(e=>e.textContent=C.name);
const mail=document.getElementById('mail');mail.textContent=C.email;mail.href='mailto:'+C.email;
document.getElementById('c-name').textContent=C.name;
document.getElementById('c-born').textContent='b. '+C.born;
document.getElementById('c-role').textContent=C.role;
document.getElementById('c-loc').textContent=C.location;
const ph=document.getElementById('c-phone');ph.textContent=C.phone;ph.href='tel:'+C.phone.replace(/\s/g,'');
document.getElementById('socials').innerHTML=C.socials.map(s=>
  `<a href="${s.url}" target="_blank" rel="noopener">${s.label} <em>${s.handle}</em> ↗</a>`).join('');

const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}}),{threshold:.1});
document.querySelectorAll('.reveal').forEach(e=>io.observe(e));

window.mountSwitcher('index');
</script>
</body>
</html>
